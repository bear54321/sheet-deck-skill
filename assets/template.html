<!doctype html>
<html lang="zh-Hant" data-theme="street" data-layout="street" data-deck="__DECK_ID__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新簡報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#DC9A8B; --accent-soft:rgba(176,122,78,.16); --accent-soft2:rgba(176,122,78,.42);
  --bg:#FFFFFF; --ink:#333; --sub:#8F8A84; --spd:1; --wc:.9;
  --ui:#1f9d63; --ui-line:#E6E3DE; --ui-bg:#F4F2EE;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--ui-bg)}
button{font:inherit;cursor:pointer}

/* ================= APP SHELL ================= */
#bar{position:absolute;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:50}
#bar .dot{width:10px;height:10px;border-radius:50%;background:var(--ui);box-shadow:0 0 0 4px rgba(31,157,99,.15)}
#bar .ttl{font-weight:700;font-size:17px}
#bar .pg{color:#999;font-size:14px;margin-right:auto}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ui-line);background:#fff;color:#444;display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:background .2s,transform .15s}
.btn:hover{background:#f6f5f2}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ui);border-color:var(--ui);color:#fff;font-weight:700}
.btn.pri:hover{background:#188a56}
.btn svg{width:16px;height:16px}
.dd{position:relative}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:6px;min-width:220px;display:none}
.dd.open .menu{display:block}
.menu button{display:flex;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;gap:10px;align-items:center;font-size:15px;color:#333}
.menu button:hover{background:#f4f2ee}
.menu small{color:#999;font-size:12px;margin-left:auto}

#side{position:absolute;left:0;top:64px;bottom:0;width:220px;background:#fff;border-right:1px solid var(--ui-line);overflow:auto;z-index:40}
#side h4{margin:0;padding:18px 18px 12px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--ui-line)}
#side h4 span{color:#999;font-weight:400}
#thumbs{padding:14px 18px}
.thumb.dragging{opacity:.35}
.thumb.dropB{box-shadow:0 -9px 0 -5px var(--ui),0 0 0 1px var(--ui-line)}
.thumb.dropA{box-shadow:0 9px 0 -5px var(--ui),0 0 0 1px var(--ui-line)}
.thumb{position:relative;width:184px;height:103.5px;border-radius:10px;overflow:hidden;margin-bottom:16px;cursor:pointer;box-shadow:0 0 0 1px var(--ui-line);transition:box-shadow .2s,transform .2s}
.thumb:hover{transform:translateY(-2px)}
.thumb.on{box-shadow:0 0 0 3px var(--ui)}
.thumb .tin{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.0958333);transform-origin:0 0;pointer-events:none}
.thumb .tno{position:absolute;left:6px;top:6px;z-index:5;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;font-family:Menlo,monospace}
.thumb.on .tno{background:var(--ui)}

#panel{position:absolute;right:0;top:64px;bottom:0;width:300px;background:#fff;border-left:1px solid var(--ui-line);overflow:auto;padding:8px 22px 30px;z-index:40}
.grp{padding:18px 0;border-bottom:1px solid var(--ui-line)}
.grp label.h{display:block;font-size:13px;color:#999;margin-bottom:12px;letter-spacing:1px}
select{width:100%;height:44px;border:1px solid var(--ui-line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:#fff}
.seg{display:flex;background:#f2f0ec;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;font-size:14px;color:#777}
.seg button.on{background:#fff;color:#222;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw button{height:40px;border-radius:10px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.sw button.on{border-color:#222}
.sw .lab{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:#888}
.sw input[type=color]{width:100%;height:40px;border:1px solid var(--ui-line);border-radius:10px;background:#fff;padding:3px}
input[type=range]{width:100%;accent-color:var(--ui)}
.rv{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-top:4px}
.tip{font-size:13px;color:#999;line-height:1.7;margin-top:16px}

#view{position:absolute;left:220px;right:300px;top:64px;bottom:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(80,60,40,.18);background:var(--bg)}
#pager{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;padding:6px 10px;font-family:Menlo,monospace;font-weight:700;font-size:16px}
#pager button{border:0;background:none;width:34px;height:34px;border-radius:8px;color:#888;font-size:20px}
#pager button:hover{background:#f4f2ee}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);background:#222;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}

body.present #bar,body.present #side,body.present #panel,body.present #pager{display:none}
body.present #view{left:0;right:0;top:0;background:#000}
body.present #stage{border-radius:0;box-shadow:none}
html[data-mode=player] body{background:#000}
html[data-mode=player] #view{left:0;right:0;top:0;bottom:0;background:#000;cursor:pointer}
html[data-mode=player] #stage{border-radius:0;box-shadow:none}
#prog{position:absolute;left:0;bottom:0;height:6px;width:0;z-index:20;background:linear-gradient(90deg,var(--accent),#E3B5A4);transition:width .6s ease}

/* ===== keynote-style shell ===== */
#bar{justify-content:space-between;gap:6px;padding:0 12px}
#bar .bl,#bar .bc,#bar .br{display:flex;align-items:center;gap:2px}
#bar .bl{flex:1 1 0;min-width:0;gap:10px}#bar .br{flex:1 1 0;justify-content:flex-end}
#bar .bl .pg{margin:0;white-space:nowrap}#bar .ttl{white-space:nowrap}
.tb{border:0;background:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:54px;height:54px;padding:4px 8px;border-radius:10px;color:#3d3d3d;font-size:11.5px;line-height:1;white-space:nowrap;transition:background .15s}
.tb svg{width:22px;height:22px;flex:none}.tb:hover{background:#f1efea}.tb:active{transform:scale(.96)}
.tb.ib{min-width:40px;height:40px}.tb.ib.on{color:var(--ui)}
#bPlay svg{color:var(--ui)}
.tb.busy{pointer-events:none;opacity:.6}.tb.busy svg{animation:spin 1.2s linear infinite}
.sep{width:1px;height:30px;background:var(--ui-line);margin:0 6px;flex:none}
.livebtn .ic{display:block;width:22px;height:22px}.livebtn .dl{display:flex;align-items:center;gap:5px}
.livebtn em{font-style:normal;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.itabs{display:flex;gap:2px;background:#f1efea;border-radius:12px;padding:3px}
.itabs .tb{height:48px;min-width:50px}.itabs .tb.on{background:#fff;color:var(--ui);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#bar .menu{top:60px}#dd3 .menu{left:50%;right:auto;transform:translateX(-50%)}
body.noside #side{display:none}body.noside #view{left:0}
body.nopanel #panel{display:none}body.nopanel #view{right:0}
#panel{padding-top:0}
#panel .ph{position:sticky;top:0;z-index:2;background:#fff;margin:0 -22px;padding:16px 22px 12px;text-align:center;font-weight:700;font-size:15px;color:#555;border-bottom:1px solid var(--ui-line)}
.ptab{display:none}.ptab.on{display:block}
#panel input[type=password]{width:100%;height:40px;border:1px solid var(--ui-line);border-radius:10px;padding:0 10px;font:inherit;font-size:13px;margin-bottom:10px}
@media (max-width:1250px){.tb>span{display:none}.tb{min-width:40px;height:44px}.livebtn .dl em{display:none}#bar .ttl{display:none}}
/* ================= SLIDES ================= */
.slide{position:absolute;inset:0;background:var(--bg);overflow:hidden;opacity:0;visibility:hidden;z-index:0}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.leaving{opacity:1;visibility:visible;z-index:1}
.slide>*:not(.deco){position:absolute;z-index:2}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco svg{width:100%;height:100%;display:block}

/* page transitions */
#stage[data-trans=none] .slide.leaving{visibility:hidden}
#stage[data-trans=fade] .slide.active{animation:tIn calc(.8s*var(--spd)) ease both}
#stage[data-trans=fade] .slide.leaving{animation:tOut calc(.8s*var(--spd)) ease both}
#stage[data-trans=slide] .slide.active{animation:sIn calc(.8s*var(--spd)) cubic-bezier(.7,0,.2,1) both}
#stage[data-trans=slide] .slide.leaving{animation:sOut calc(.8s*var(--spd)) cubic-bezier(.7,0,.2,1) both}
#stage[data-trans=zoom] .slide.active{animation:zIn calc(.8s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
#stage[data-trans=zoom] .slide.leaving{animation:zOut calc(.8s*var(--spd)) ease both}
#stage[data-trans=flip] .slide.active{animation:fIn calc(.9s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
#stage[data-trans=flip] .slide.leaving{animation:fOut calc(.5s*var(--spd)) ease-in both}
/* 3D cube */
#stage[data-trans=cube][data-dir=fwd] .slide.active{transform-origin:0% 50%;animation:cubeInF calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=fwd] .slide.leaving{transform-origin:100% 50%;animation:cubeOutF calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=back] .slide.active{transform-origin:100% 50%;animation:cubeInB calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=back] .slide.leaving{transform-origin:0% 50%;animation:cubeOutB calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
@keyframes cubeInF{from{transform:perspective(2600px) translateX(100%) rotateY(90deg)}to{transform:perspective(2600px)}}
@keyframes cubeOutF{from{transform:perspective(2600px)}to{transform:perspective(2600px) translateX(-100%) rotateY(-90deg)}}
@keyframes cubeInB{from{transform:perspective(2600px) translateX(-100%) rotateY(-90deg)}to{transform:perspective(2600px)}}
@keyframes cubeOutB{from{transform:perspective(2600px)}to{transform:perspective(2600px) translateX(100%) rotateY(90deg)}}
#stage[data-trans=cube]{background:#2a2622}
/* 3D book */
.slide.leaving .a{opacity:1;animation:none}
.slide.leaving .bar{width:var(--w);transition:none}
.slide.leaving .rb{stroke-dashoffset:calc(100 - var(--p));transition:none}
.slide.leaving .draw{stroke-dashoffset:0;animation:none}
body[data-hl=underline] .slide.leaving mark{background-size:100% 100%;transition:none}
.slide.clipL{clip-path:inset(0 50% 0 0)}
.slide.clipR{clip-path:inset(0 0 0 50%)}
.slide.hold .a{animation:none!important;opacity:0!important}
.slide.hold .draw{animation:none!important}
.slide.hold .rb{stroke-dashoffset:100!important;transition:none!important}
.slide.hold .bar{width:0!important;transition:none!important}
.slide.flipped .in-tl,.slide.flipped .in-tr,.slide.flipped .in-bl,.slide.flipped .in-br,.slide.flipped .dots circle{animation:none!important}
.book{position:absolute;inset:0;z-index:6;perspective:3200px;pointer-events:none}
.book::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:80px;margin-left:-40px;background:linear-gradient(90deg,transparent,rgba(60,40,20,.18),transparent);z-index:7}
.flip{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face>.slide{width:1920px;right:auto}
.face.front>.slide{left:-960px}
.face.back>.slide{left:0}
.face .shade{position:absolute;inset:0;z-index:9;animation:pgShade var(--fd) ease-in-out both}
.face.front .shade{background:linear-gradient(90deg,rgba(40,25,10,.55),rgba(40,25,10,.1) 60%,rgba(255,255,255,.12))}
.face.back .shade{background:linear-gradient(270deg,rgba(40,25,10,.55),rgba(40,25,10,.1) 60%,rgba(255,255,255,.12))}
@keyframes pgFwd{0%{transform:rotateY(0)}50%{transform:rotateY(-90deg) translateZ(30px)}100%{transform:rotateY(-180deg)}}
@keyframes pgBack{0%{transform:rotateY(-180deg)}50%{transform:rotateY(-90deg) translateZ(30px)}100%{transform:rotateY(0)}}
@keyframes pgShade{0%,100%{opacity:0}50%{opacity:1}}
@keyframes tIn{from{opacity:0}to{opacity:1}}@keyframes tOut{from{opacity:1}to{opacity:0}}
@keyframes sIn{from{transform:translateX(calc(var(--dir,1)*100%))}to{transform:none}}
@keyframes sOut{from{transform:none}to{transform:translateX(calc(var(--dir,1)*-35%));opacity:.3}}
@keyframes zIn{from{opacity:0;transform:scale(1.18)}to{opacity:1;transform:none}}
@keyframes zOut{to{opacity:0;transform:scale(.88)}}
@keyframes fIn{from{opacity:0;transform:perspective(2400px) rotateY(calc(var(--dir,1)*-75deg))}to{opacity:1;transform:none}}
@keyframes fOut{to{opacity:0;transform:perspective(2400px) rotateY(calc(var(--dir,1)*75deg))}}

/* element entrance */
.a{opacity:0}
.slide.active .a{animation:var(--anim,up) calc(1s*var(--spd)) cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s)*var(--spd) + .25s*var(--spd))}
.a.l{--anim:fromL}.a.r{--anim:fromR}.a.z{--anim:pop}.a.b{--anim:blurIn}.a.dn{--anim:down}.a.sp{--anim:spread}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}
@keyframes blurIn{from{opacity:0;filter:blur(16px);transform:scale(1.06)}to{opacity:1;filter:none;transform:none}}
@keyframes spread{from{opacity:0;letter-spacing:0}to{opacity:1}}
body[data-anim=off] .a{animation:none!important;opacity:1}

/* deco motion */
.slide.active .in-tl{animation:dTL calc(1.6s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-tr{animation:dTR calc(1.6s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-bl{animation:dBL calc(1.6s*var(--spd)) .1s cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-br{animation:dBR calc(1.6s*var(--spd)) .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dTL{from{transform:translate(-300px,-240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dTR{from{transform:translate(300px,-240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dBL{from{transform:translate(-300px,240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dBR{from{transform:translate(300px,240px);opacity:0}to{transform:none;opacity:1}}
.wc{opacity:var(--wc)}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(2deg)}}
.sway{transform-box:view-box;transform-origin:0 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .draw{animation:draw calc(2.4s*var(--spd)) calc(.5s*var(--spd)) ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dots circle{transform-box:fill-box;transform-origin:center}
.slide.active .dots circle{animation:dotIn .6s cubic-bezier(.2,.8,.2,1.4) both;animation-delay:calc(var(--i)*18ms + .6s)}
@keyframes dotIn{from{transform:scale(0)}to{transform:none}}
body[data-anim=off] .deco *{animation:none!important;stroke-dashoffset:0}
body[data-leaf=off] .leaf{display:none}

/* static (thumbnails / export / print) */
.static{opacity:1!important;visibility:visible!important;z-index:1!important}
.static *,.static{animation:none!important;transition:none!important}
.static .a{opacity:1!important}
.static .draw{stroke-dashoffset:0}

/* highlight styles */
mark{color:inherit;background:none;padding:0 .12em;transition:background-size calc(.9s*var(--spd)) calc(1.2s*var(--spd)) ease}
body[data-hl=glass] mark{background:var(--accent-soft);border:1.5px solid var(--accent-soft2);border-radius:10px;padding:0 .28em;box-shadow:inset 0 1px 0 #FDF1EE}
body[data-hl=capsule] mark{background:var(--accent);color:#fff;border-radius:999px;padding:.02em .5em}
body[data-hl=underline] mark{background-image:linear-gradient(transparent 60%,var(--accent-soft2) 60%);background-repeat:no-repeat;background-size:0% 100%}
body[data-hl=underline] .slide.active mark,body[data-hl=underline] .static mark{background-size:100% 100%}
body[data-hl=text] mark{color:var(--accent);font-weight:700}

/* slide components */
.cover-k{left:0;right:0;top:200px;text-align:center;font-size:24px;letter-spacing:10px;color:var(--sub)}
.cover-t1{left:0;right:0;top:250px;text-align:center;font-size:110px;font-weight:500;color:var(--accent);line-height:1.3;margin:0}
.cover-t2{left:0;right:0;top:395px;text-align:center;font-size:122px;font-weight:500;color:#1d1d1d;line-height:1.3;margin:0}
.cover-s{left:0;right:0;top:600px;text-align:center;font-size:20px;letter-spacing:20px;color:#6d6d6d}
.cover-r{left:0;right:0;top:745px;text-align:center;font-size:32px;color:#333}
.cover-d{left:0;right:0;top:805px;text-align:center;font-size:28px;color:var(--accent);letter-spacing:2px}

.hd{left:0;right:0;top:70px;display:flex;justify-content:center;align-items:center;gap:30px}
.hn{font-size:150px;font-weight:300;color:var(--accent);line-height:1}
.hd h2{margin:0;font-size:66px;font-weight:500;color:#3b3b3b;letter-spacing:4px}
.hd p{margin:6px 0 0;font-size:20px;color:var(--sub);letter-spacing:6px}

.pt{display:flex;gap:30px;margin-bottom:56px}
.pt i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:16px;box-shadow:0 0 0 9px var(--accent-soft)}
.pt h3{margin:0 0 10px;font-size:38px;font-weight:500;color:#333}
.pt p{margin:0;font-size:26px;line-height:1.85;color:#666}

.card{background:#FDF1EE;border-radius:26px;box-shadow:0 18px 50px rgba(200,120,105,.10);padding:46px;transition:transform .4s,box-shadow .4s}
.card:hover{transform:translateY(-8px);box-shadow:0 26px 60px rgba(200,120,105,.16)}
.ringbox{position:relative;width:250px;height:250px;margin:0 auto}
.ringbox svg{width:100%;height:100%}
.rb{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset calc(1.8s*var(--spd)) calc(.8s*var(--spd)) cubic-bezier(.3,.8,.2,1)}
.slide.active .rb,.static .rb{stroke-dashoffset:calc(100 - var(--p))}
.rnum{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:62px;font-weight:500;color:#444}
.ctext{font-size:27px;line-height:1.8;color:#555;text-align:center;margin:26px 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{display:inline-block;padding:9px 20px;border-radius:30px;background:#FBE9E4;color:#6b5a4a;font-size:21px}
.code{display:block;margin:24px auto 0;width:max-content;font-family:'SF Mono',Menlo,Consolas,monospace;background:#4F6B6B;color:#fff;padding:12px 28px;border-radius:12px;font-size:26px}

.legend{display:flex;gap:30px;font-size:22px;color:#777}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:26px;height:14px;border-radius:7px;display:inline-block}

/* ---------------- 簡報風格（工具列「風格」）----------------
   coral＝範本原本的珊瑚扁平風；其他 15 種取材自 Lemo-Opuscar 風格庫（CC BY-NC 4.0），只換 --th-* 變數與少數規則。
   以下通用規則只在非 coral 時生效，所以原本的樣子完全不變。 */

/* ---------------- 版型（data-layout）：青綠街景 street／珊瑚扁平 coral ----------------
   版型決定構圖（外框、樹枝、草、人行道、房子）；風格（data-theme）只換顏色、字體、質感。 */
.g-street{display:none}
:root[data-layout=street] .g-street{display:inline}
:root[data-layout=street] .g-coral{display:none}
.stf{fill:var(--th-frame,#469C9B)}
.lc0{fill:var(--th-l0,#8DB24E)}.lc1{fill:var(--th-l1,#5E8F3E)}.lc2{fill:var(--th-l2,#3F6E44)}.lc3{fill:var(--th-l3,#2F6B6A)}.lc4{fill:var(--th-l4,#A9C76A)}
.bk{stroke:var(--th-bark,#7A4E33)}.stw{fill:var(--th-walk,#EADFD3)}.stt{stroke:var(--th-tile,#9C8B7E)}
.bd1{fill:var(--th-b1,#EBC68A)}.bd2{fill:var(--th-b2,#B89BD8)}.bd3{fill:var(--th-b3,#8C6D2E)}.bd4{fill:var(--th-b4,#9CCBE0)}.bd5{fill:var(--th-b5,#E8F4FA)}.bd6{fill:var(--th-b6,#E7B98C)}.bd7{fill:var(--th-b7,#B86B3E)}
:root[data-theme=street]{--th-bg:#FFFFFF;--th-frame:#469C9B;--th-onframe:#FFFFFF;--th-ink:#3E4A4A;--th-ink2:#7F7F7F;--th-sub:#9A9A9A;--th-card:#FFFFFF;--th-line:#DCDCDC;--th-h:#469C9B;--th-grid:rgba(70,156,155,.16);--th-fb:'Noto Serif TC','Songti TC',Georgia,serif;--th-ft:'Noto Serif TC','Songti TC',Georgia,serif;--th-tw:600}
/* 15 種風格放在青綠街景版型上：插圖顏色由風格的變數推出來 */
:root:not([data-theme=street]):not([data-theme=coral]){--th-frame:var(--th-h);--th-onframe:#FFFFFF;--th-l0:var(--th-d1);--th-l1:var(--th-d2);--th-l2:var(--th-d3);--th-l3:var(--th-d4);--th-l4:var(--th-d5);--th-bark:var(--th-ink);--th-walk:var(--th-card);--th-tile:var(--th-line);--th-b1:var(--th-d2);--th-b2:var(--th-d3);--th-b3:var(--th-ink);--th-b4:var(--th-d4);--th-b5:var(--th-card);--th-b6:var(--th-d1);--th-b7:var(--th-d5)}
:root[data-theme=artdeco][data-layout]{--th-onframe:#12161F}
:root[data-theme=blueprint][data-layout]{--th-onframe:#1D4F91}
:root[data-theme=chalk][data-layout]{--th-onframe:#25382F}
:root[data-theme=neon][data-layout]{--th-onframe:#0C0A14}
:root[data-theme=crt][data-layout]{--th-onframe:#050A06}
:root[data-theme=silent][data-layout]{--th-onframe:#1A1714}
:root[data-theme=swiss][data-layout]{--th-frame:#E30613}
:root[data-theme=papercut][data-layout]{--th-frame:#B3261E}
:root[data-theme=riso][data-layout]{--th-frame:#FF4FA3}

:root[data-layout=street] :is(.card,.kp,.chartbox){border-width:3px!important;border-radius:12px!important}
:root[data-layout=street] .hd h2{letter-spacing:3px}
:root[data-layout=street] .hd>div:last-child{border-bottom:2px solid var(--th-frame,#469C9B);padding:0 70px 14px}

.tsz{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tsz button{width:46px;height:42px;border:1px solid var(--ui-line);background:#fff;border-radius:10px;font-size:18px;font-weight:700;color:#444;cursor:pointer}
.tsz button:hover{background:#f4f2ee}.tsz sup{font-size:12px}
.tsz input{flex:1;min-width:0;height:42px;border:1px solid var(--ui-line);border-radius:10px;text-align:center;font:inherit;font-size:18px;font-weight:700}
.tsz span{font-size:13px;color:#999}
.tpre{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.tpre button{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:7px 0;font-size:12px;color:#555;cursor:pointer}
.tpre button:hover{background:#f4f2ee}
[data-ed][contenteditable]:focus{outline:2px dashed rgba(31,157,99,.6);outline-offset:4px;border-radius:4px}

.tsty{display:flex;gap:8px}
.tsty button{flex:1;height:40px;border:1px solid var(--ui-line);background:#fff;border-radius:10px;font-size:18px;color:#444;cursor:pointer}
.tsty button.on{background:#E9F6EF;border-color:var(--ui);color:var(--ui)}
.tcol{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.tcol button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;padding:0}
.tcol button.on{box-shadow:0 0 0 2px var(--ui)}
.tcc{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#888}
.tcc input{flex:1;height:34px;border:1px solid var(--ui-line);border-radius:8px;background:#fff;padding:2px}
/* text boxes */
.tbox{padding:6px 10px;border-radius:8px;border:2px dashed transparent}
.tbox .tbt{font-size:40px;color:#4A5656;line-height:1.5;min-height:1.5em;outline:none;word-break:break-word}
.tbox:hover{border-color:rgba(31,157,99,.25)}
.tbox.sel{border-color:rgba(31,157,99,.7)}
.tbox .grip{position:absolute;left:-40px;top:6px;width:32px;height:40px;border-radius:8px;background:var(--ui);color:#fff;font-style:normal;font-size:22px;display:none;align-items:center;justify-content:center;cursor:move;touch-action:none}
.tbox .h{position:absolute;right:-13px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ui);display:none;cursor:ew-resize;touch-action:none}
.tbox:hover .grip,.tbox.sel .grip{display:flex}.tbox:hover .h,.tbox.sel .h{display:block}
.tbox.drag{opacity:.85}
.static .tbox,body.present .tbox,html[data-mode=player] .tbox{border-color:transparent!important}
.static .tbox .grip,.static .tbox .h,body.present .tbox .grip,body.present .tbox .h,html[data-mode=player] .tbox .grip,html[data-mode=player] .tbox .h{display:none!important}
.slide.active .tbox{animation:cbIn calc(.8s*var(--spd)) calc(.35s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
.slide.hold .tbox,body[data-anim=off] .tbox{animation:none!important}

.srow{display:grid;grid-template-columns:12px 1fr auto auto auto;align-items:center;gap:4px 6px;padding:8px 0;border-bottom:1px dashed var(--ui-line)}
.srow .sdot{width:9px;height:9px;border-radius:50%;background:#ccc}.srow .sdot.ok{background:#3aa66a}.srow .sdot.err{background:#d0604f}
.srow .sname{min-width:0;border:1px solid transparent;border-radius:6px;padding:4px 6px;font:inherit;font-size:14px;color:#333;background:none}
.srow .sname:hover{border-color:var(--ui-line)}.srow .sname:focus{border-color:var(--ui);outline:none;background:#fff}
.srow{grid-template-columns:12px 1fr auto auto auto auto}
.srow .sadd{color:var(--ui);font-weight:700;font-size:17px}
.srow .sbtn{border:0;background:none;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px}
.srow .sbtn:hover{background:#f2f0ec}
.srow .suse{grid-column:2/-1;font-size:12px;color:#aaa;padding-left:7px}

.uin{width:100%;height:40px;border:1px solid var(--ui-line);border-radius:10px;padding:0 10px;font:inherit;font-size:13px}
.ubtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.ubtns .btn{justify-content:center;padding:0 8px;font-size:14px}

.flycv{position:absolute!important;left:0;top:0;width:100%!important;height:100%!important;z-index:8!important;pointer-events:none}
.flycv.showcv{pointer-events:auto;cursor:grab;border-radius:28px;background:radial-gradient(ellipse at 50% 40%,#FFFBF9 0%,#FCEDE8 70%,#F8E0D9 100%);border:2px solid #F6DCD6;touch-action:none}
.flycv.showcv.grab{cursor:grabbing}
#fbxList .fxrow{display:flex;align-items:center;gap:2px}
#fbxList .fxrow [data-fbx]{flex:1;min-width:0}
#fbxList .fxn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#fbxList small{flex:none;white-space:nowrap}
#fbxList .fxdel{flex:none;width:34px!important;justify-content:center;padding:8px 0!important;opacity:.55}
#fbxList .fxdel:hover{opacity:1;background:#fbe9e6!important}
.flycv.showcv.moving{cursor:move!important;outline:3px dashed var(--ui);outline-offset:4px}
body.flyhover #stage{cursor:grab}body.flydrag #stage,body.flydrag #stage *{cursor:grabbing!important}
.slide.active .flycv{animation:tIn calc(1s*var(--spd)) calc(.5s*var(--spd)) both}

/* print */
#printroot{display:none}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block}
  #printroot .page{position:relative;width:1920px;height:1080px;overflow:hidden;page-break-after:always;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function R(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f=n=>n.toFixed(1);
function catmull(p,closed){
  const n=p.length;let d=`M${f(p[0][0])},${f(p[0][1])}`;
  const g=i=>closed?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}
  return d+(closed?'Z':'');

/* ---------------- 青綠街景版型的插圖 ----------------
   外框（.stf）＋露出底色的內頁；封面有樹枝、草叢、人行道、房子；內頁是縮小版的同一個場景（較細的外框、角落樹枝、矮草叢、右下小房子），內容疊在插圖上面。全部用 SVG 畫，沒有外部圖片。
   顏色都用 class（.stf .lc0-4 .bk .stw .stt .bd1-7），換風格時由 --th-* 變數重新上色。 */
function streetDeco(type,sid){const r=R(sid*131+7),o=[],big=type==='cover';
  const lc=()=>'lc'+Math.floor(r()*5);
  const leafAt=(x,y,a,sz,i)=>`<path class="lf ${lc()}" style="--i:${i}" d="M0,0 Q${f(sz*.5)},${f(-sz*.32)} ${f(sz)},0 Q${f(sz*.5)},${f(sz*.32)} 0,0Z" transform="translate(${f(x)},${f(y)}) rotate(${f(a)})"/>`;
  /* 樹枝：一條主幹＋幾條細枝，枝上長葉子 */
  const branch=(x0,y0,x1,y1,w,mir,n)=>{let s='';const M=x=>mir?1920-x:x,cx=(x0+x1)/2+(mir?-1:1)*40,cy=(y0+y1)/2+60;
    s+=`<path class="bk" d="M${M(x0)},${y0}Q${M(cx)},${cy} ${M(x1)},${y1}" fill="none" stroke-width="${w}" stroke-linecap="round"/>`;
    for(let k=0;k<n;k++){const t=.25+k*.7/n,u=1-t,px=u*u*x0+2*u*t*cx+t*t*x1,py=u*u*y0+2*u*t*cy+t*t*y1,len=60+r()*90,ang=(r()<.5?-1:1)*(25+r()*30)+(Math.atan2(y1-y0,x1-x0)*180/Math.PI),
        ex=px+Math.cos(ang*Math.PI/180)*len,ey=py+Math.sin(ang*Math.PI/180)*len;
      s+=`<path class="bk" d="M${f(M(px))},${f(py)}L${f(M(ex))},${f(ey)}" stroke-width="${f(w*.45)}" stroke-linecap="round"/>`;
      for(let q=0;q<7;q++){const tt=.2+q*.12,lx=px+(ex-px)*tt,ly=py+(ey-py)*tt;s+=leafAt(M(lx),ly,(mir?180-ang:ang)+(q%2?55:-55)+(r()-.5)*30,30+r()*18,k*7+q)}}
    return `<g class="leaf sw-br" style="transform-origin:${mir?'1920px 0':'0 0'}${mir?';animation-direction:normal,reverse':''}">${s}</g>`};
  const ring=(m,b)=>`<path class="stf" fill-rule="evenodd" d="M0,0H1920V1080H0Z M${m},${m}V${1080-b}H${1920-m}V${m}Z"/>`;
  /* 房子（簡單的幾何）；s＝縮放，以人行道上緣（y=985）為基準 */
  const houses=(s,dx)=>`<g class="leaf" transform="translate(${dx},${f(985*(1-s))}) scale(${s})"><rect class="bd1" x="1560" y="560" width="240" height="425"/><rect class="bd2" x="1550" y="540" width="260" height="30"/>`+
      [...Array(12)].map((_,i)=>`<rect class="bd3" x="${1590+(i%3)*68}" y="${600+Math.floor(i/3)*90}" width="34" height="50" opacity=".75"/>`).join('')+
      `<rect class="bd4" x="1420" y="700" width="140" height="285"/><rect class="bd5" x="1440" y="730" width="100" height="120"/><rect class="bd6" x="1300" y="800" width="120" height="185"/><rect class="bd7" x="1290" y="780" width="140" height="26"/></g>`;
  /* 人行道：top＝上緣 */
  const walk=top=>{let s=`<rect class="stw" x="0" y="${top}" width="1920" height="${1080-top}"/><path class="stt" d="M0,${top+27}H1920" stroke-width="3"/>`;
    for(let x=-60;x<1980;x+=300)s+=`<path class="stt" d="M${x+40},${top+27}L${x-10},1080" stroke-width="3"/>`;return s};
  /* 草叢：底部一排葉片，中間比較矮，不擋到文字；base＝草根的 y，k＝高度倍數 */
  const grass=(base,k)=>{let g='';for(let i=0;i<70;i++){const x=-20+i*28+r()*16,mid=Math.abs(x-960)<520,h=((mid?50:110)+r()*(mid?60:130))*k,lean=(r()-.5)*60;
      g+=`<path class="gb ${lc()}" style="--i:${i%14}" d="M${f(x-12)},${base}Q${f(x+lean*.3)},${f(base-h*.6)} ${f(x+lean)},${f(base-h)}Q${f(x+lean*.2+8)},${f(base-h*.5)} ${f(x+14)},${base}Z"/>`}
    return `<g class="leaf">${g}</g>`};
  if(big){
    o.push(ring(70,80));
    o.push(walk(985));
    o.push(houses(1,0));
    o.push(grass(990,1));
    o.push(branch(-30,360,360,-20,20,false,7)+branch(-30,360,360,-20,20,true,7));

    o.push(walk(1036));
    o.push(houses(.42,1110));
    o.push(grass(1040,.45));
    o.push(branch(-20,240,240,-20,13,false,4)+branch(-20,240,240,-20,13,true,4));
  }

  let list=[];try{list=JSON.parse(lsGet(LS+'ai-models:gemini')||'[]')}catch(e){}
  const alts=list.map(x=>x[0]).filter(id=>id!==model&&/^gemini-\d+(\.\d+)?-flash(-lite)?$/.test(id)).slice(0,3);
  for(const m2 of alts){note&&note(model+' 太忙，改用 '+m2+' 試試…');try{return await geminiOnce(key,m2,b64,note)}catch(e){if(!busy(e))throw e}}
  throw new AIError('Gemini 伺服器目前太忙（503），重試和換模型都沒成功。這是 Google 那邊暫時的狀況，請過幾分鐘再試，或改用 Claude／ChatGPT。')}
async function summarize(p,key,model,b64,fname,note){
  if(p==='claude'){const A=await loadSDK(),client=new A({apiKey:key,dangerouslyAllowBrowser:true});
    const req={model,max_tokens:16000,output_config:{effort:'medium',format:{type:'json_schema',schema:SUM_SCHEMA}},
      messages:[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:SUM_PROMPT}]}]};
    // Haiku has no server-side refusal fallback; the others opt in by default
    const msg=model.includes('haiku')?await client.messages.create(req):await client.beta.messages.create({...req,betas:['server-side-fallback-2026-07-01'],fallbacks:'default'});
    if(msg.stop_reason==='refusal')throw new AIError('Claude 沒有處理這份文件'+(msg.stop_details&&msg.stop_details.explanation?'：'+msg.stop_details.explanation:''));
    if(msg.stop_reason==='max_tokens')throw new AIError('摘要被截斷了，請再試一次');
    const t=msg.content.find(b=>b.type==='text');if(!t)throw new AIError('沒有收到摘要內容');return norm(parseOut(t.text),msg.model||model)}
  if(p==='gemini')return geminiRetry(key,model,b64,note);
  const j=await httpJSON(p,'https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+key},
    body:JSON.stringify({model,messages:[{role:'user',content:[{type:'file',file:{filename:fname||'document.pdf',file_data:'data:application/pdf;base64,'+b64}},{type:'text',text:SUM_PROMPT}]}],
      response_format:{type:'json_schema',json_schema:{name:'slide_summary',strict:true,schema:SUM_SCHEMA}}})},note);
  const ch=(j.choices||[])[0],m=ch&&ch.message;if(!m)throw new AIError('ChatGPT 沒有回傳內容');if(m.refusal)throw new AIError('ChatGPT 沒有處理這份文件：'+m.refusal);
  if(ch.finish_reason==='length')throw new AIError('摘要被截斷了，請再試一次');return norm(parseOut(m.content),j.model||model)}
function aiErr(e){if(e instanceof AIError)return e.message;const A=ANT;
  if(A){if(e instanceof A.AuthenticationError)return'Claude 金鑰不正確或已失效，請到右側「文件」分頁重新輸入';
    if(e instanceof A.PermissionDeniedError)return'這把 Claude 金鑰沒有權限使用這個模型';
    if(e instanceof A.RateLimitError)return'Claude 使用量超過上限，請稍後再試';
    if(e instanceof A.BadRequestError)return'Claude 無法處理這份 PDF：'+((e.error&&e.error.error&&e.error.error.message)||e.message);
    if(e instanceof A.APIConnectionError)return'連不上 Claude，請檢查網路';
    if(e instanceof A.APIError)return'Claude 錯誤（'+(e.status||'?')+'）：'+e.message}
  else if(e&&/import|module|Failed to fetch dynamically/i.test(String(e.message)))return'無法載入 Claude 程式庫（需要網路）';
  return(e&&e.message)||String(e)}
function addPdfSlide(id){const sid='n'+Date.now().toString(36);S.added[sid]={from:'pdf:'+id};const el=makeSlide(sid,'pdf:'+id);
  slides[cur].after(el);prepSlide(el);afterStructure(cur+1,1)}

/* ---------------- keynote-style shell ---------------- */
if(!PLAYER){
  const UIK=KEY+':ui';let UI={tab:'fmt',panel:1,side:1};try{Object.assign(UI,JSON.parse(localStorage.getItem(UIK)||'{}'))}catch(e){}
  const saveUI=()=>{try{localStorage.setItem(UIK,JSON.stringify(UI))}catch(e){}},TT={anim:'動畫',doc:'文件'};
  const OBJ=['textGrp','chartGrp','flyGrp'].map(x=>document.getElementById(x)).filter(Boolean),shown=g=>g.style.display!=='none';
  function syncFmt(){const n=OBJ.filter(shown).length;document.getElementById('slideFmt').style.display=n?'none':'';
    document.getElementById('ptitle').textContent=UI.tab==='fmt'?(n?'物件格式':'幻燈片'):TT[UI.tab]}
  function applyUI(){document.body.classList.toggle('nopanel',!UI.panel);document.body.classList.toggle('noside',!UI.side);
    document.querySelectorAll('#panel .ptab').forEach(p=>p.classList.toggle('on',p.dataset.tab===UI.tab));
    document.querySelectorAll('.itabs [data-tab]').forEach(b=>b.classList.toggle('on',!!UI.panel&&b.dataset.tab===UI.tab));
    document.getElementById('bSide').classList.toggle('on',!!UI.side);syncFmt();dispatchEvent(new Event('resize'))}
  function openTab(t){UI.tab=t;UI.panel=1;saveUI();applyUI()}
  document.querySelectorAll('.itabs [data-tab]').forEach(b=>b.onclick=()=>{if(UI.panel&&UI.tab===b.dataset.tab)UI.panel=0;else{UI.panel=1;UI.tab=b.dataset.tab}saveUI();applyUI()});
  document.getElementById('bSide').onclick=()=>{UI.side=UI.side?0:1;saveUI();applyUI()};
  document.getElementById('bAddPg').onclick=()=>addSlide();
  const dd3=document.getElementById('dd3');
  document.getElementById('b3d').onclick=e=>{e.stopPropagation();dd.classList.remove('open');dd3.classList.toggle('open')};
  document.addEventListener('click',()=>dd3.classList.remove('open'));
  themeMenu();
  let was=new Set(OBJ.filter(shown));
  const mo=new MutationObserver(()=>{const now=OBJ.filter(shown),fresh=now.some(g=>!was.has(g));was=new Set(now);
    if(fresh&&UI.panel&&UI.tab!=='fmt')openTab('fmt');else syncFmt()});
  OBJ.forEach(g=>mo.observe(g,{attributes:true,attributeFilter:['style']}));
  applyUI();

  /* AI provider / key settings */
  const pSel=document.getElementById('aiProv'),kIn=document.getElementById('aiKey'),kSt=document.getElementById('aiStat'),mSel=document.getElementById('aiModel');
  const cachedModels=p=>p==='claude'?CLAUDE_MODELS:(()=>{try{return JSON.parse(lsGet(LS+'ai-models:'+p)||'[]')}catch(e){return[]}})();
  function fillModels(p){const list=cachedModels(p),cur=modelOf(p);
    mSel.innerHTML=list.length?list.map(([v,t])=>`<option value="${escH(v)}">${escH(t)}</option>`).join(''):'<option value="">（存好金鑰後會自動載入模型清單）</option>';
    if(list.some(x=>x[0]===cur)&&!(p==='gemini'&&/omni/i.test(cur)&&!lsGet(LS+'ai-model-chosen:'+p)))mSel.value=cur;else if(list.length){mSel.value=pickModel(p,list);lsSet(LS+'ai-model:'+p,mSel.value)}}
  function showKey(){const p=pSel.value,k=keyOf(p);kIn.value='';kIn.placeholder=AIP[p].ph;
    kSt.textContent=k?'✅ 已儲存 '+AIP[p].name+' 金鑰（'+k.slice(0,6)+'…'+k.slice(-4)+'）':'尚未設定 '+AIP[p].name+' 金鑰'}
  async function loadModels(p,k){const list=await listModels(p,k);if(p!=='claude')lsSet(LS+'ai-models:'+p,JSON.stringify(list));fillModels(p);return list}
  const autoList=p=>{if(p!=='claude'&&keyOf(p)&&!cachedModels(p).length)loadModels(p,keyOf(p)).catch(e=>{if(pSel.value===p)kSt.textContent+='・⚠️ '+aiErr(e)})};
  pSel.value=provNow();showKey();fillModels(pSel.value);autoList(pSel.value);
  pSel.onchange=()=>{lsSet(LS+'ai-provider',pSel.value);showKey();fillModels(pSel.value);autoList(pSel.value);toast('PDF 摘要改用 '+AIP[pSel.value].name)};
  mSel.onchange=()=>{if(mSel.value){lsSet(LS+'ai-model:'+pSel.value,mSel.value);lsSet(LS+'ai-model-chosen:'+pSel.value,'1')}};
  document.getElementById('aiSave').onclick=async()=>{const v=kIn.value.trim();if(!v){toast('請先貼上金鑰',3000);return}
    const g=guessProv(v);if(g&&g!==pSel.value){pSel.value=g;toast('這看起來是 '+AIP[g].name+' 的金鑰，已自動切換',4000)}
    const p=pSel.value;lsSet(LS+'ai-provider',p);setKey(p,v);showKey();fillModels(p);kSt.textContent+='・正在確認金鑰並讀取模型…';
    try{const l=await loadModels(p,v);showKey();kSt.textContent+='・可用模型 '+l.length+' 個'}catch(e){showKey();kSt.textContent+='・⚠️ '+aiErr(e)}};
  kIn.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('aiSave').click()});
  document.getElementById('aiClear').onclick=()=>{const p=pSel.value;if(!keyOf(p))return;if(!confirm('要從這個瀏覽器刪除 '+AIP[p].name+' 的金鑰嗎？'))return;setKey(p,'');showKey();toast('已刪除金鑰')};
  document.getElementById('aiTest').onclick=async()=>{const p=pSel.value,k=kIn.value.trim()||keyOf(p);if(!k){toast('請先貼上金鑰',3000);return}
    kSt.textContent='測試中…';try{const l=await loadModels(p,k);kSt.textContent='✅ '+AIP[p].name+' 連線成功，可用模型 '+l.length+' 個'+(kIn.value.trim()?'（記得按「儲存」）':'')}catch(e){kSt.textContent='❌ '+aiErr(e)}};

  /* PDF → summary slide */
  document.getElementById('bPdf').onclick=()=>{const p=provNow(),key=keyOf(p),model=modelOf(p);
    if(!key||!model){openTab('doc');setTimeout(()=>{(key?mSel:kIn).scrollIntoView({block:'center'});(key?mSel:kIn).focus()},50);
      toast(key?'請先在右側「文件」分頁選擇 '+AIP[p].name+' 的模型':'請先在右側「文件」分頁貼上 AI 的 API 金鑰（Claude、Gemini 或 ChatGPT）',5000);return}
    const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';
    inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
      if(f.size>AIP[p].mb*1024*1024){toast('PDF 太大了（'+AIP[p].name+' 上限約 '+AIP[p].mb+' MB），請先拆成小檔',6000);return}
      const b=document.getElementById('bPdf');b.classList.add('busy');toast(AIP[p].name+' 正在閱讀「'+f.name+'」…（頁數多時可能要 1 分鐘）',0);
      try{const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(r.error);r.readAsDataURL(f)});
        const out=await summarize(p,key,model,b64,f.name,m=>toast(m,0)),id='p'+Date.now().toString(36);
        (S.pdfs=S.pdfs||{})[id]={name:f.name,...out,by:AIP[p].name+'（'+out.model+'）',at:new Date().toLocaleDateString('zh-TW')};addPdfSlide(id);toast('已新增 PDF 摘要頁：'+out.title,5000)}
      catch(e){toast('⚠️ '+aiErr(e),8000)}
      finally{b.classList.remove('busy')}};
    inp.click()};
}
renderTexts();setEditable(!PLAYER);renderAllCharts();apply();fit();buildThumbs();refreshData(true);schedule();
syncOrder();buildThumbs();slides[0].classList.add('active');cur=0;go(0,1,true);
})();
