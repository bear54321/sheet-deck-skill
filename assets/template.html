<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試算表即時簡報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#DC9A8B; --accent-soft:rgba(176,122,78,.16); --accent-soft2:rgba(176,122,78,.42);
  --bg:#FFFFFF; --ink:#333; --sub:#8F8A84; --spd:1; --wc:.9;
  --ui:#1f9d63; --ui-line:#E6E3DE; --ui-bg:#F4F2EE;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--ui-bg)}
button{font:inherit;cursor:pointer}

/* ================= APP SHELL ================= */
#bar{position:absolute;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:50}
#bar .dot{width:10px;height:10px;border-radius:50%;background:var(--ui);box-shadow:0 0 0 4px rgba(31,157,99,.15)}
#bar .ttl{font-weight:700;font-size:17px}
#bar .pg{color:#999;font-size:14px;margin-right:auto}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ui-line);background:#fff;color:#444;display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:background .2s,transform .15s}
.btn:hover{background:#f6f5f2}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ui);border-color:var(--ui);color:#fff;font-weight:700}
.btn.pri:hover{background:#188a56}
.btn svg{width:16px;height:16px}
.dd{position:relative}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:6px;min-width:220px;display:none}
.dd.open .menu{display:block}
.menu button{display:flex;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;gap:10px;align-items:center;font-size:15px;color:#333}
.menu button:hover{background:#f4f2ee}
.menu small{color:#999;font-size:12px;margin-left:auto}

#side{position:absolute;left:0;top:64px;bottom:0;width:220px;background:#fff;border-right:1px solid var(--ui-line);overflow:auto;z-index:40}
#side h4{margin:0;padding:18px 18px 12px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--ui-line)}
#side h4 span{color:#999;font-weight:400}
#thumbs{padding:14px 18px}
.thumb{position:relative;width:184px;height:103.5px;border-radius:10px;overflow:hidden;margin-bottom:16px;cursor:pointer;box-shadow:0 0 0 1px var(--ui-line);transition:box-shadow .2s,transform .2s}
.thumb:hover{transform:translateY(-2px)}
.thumb.on{box-shadow:0 0 0 3px var(--ui)}
.thumb .tin{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.0958333);transform-origin:0 0;pointer-events:none}
.thumb .tno{position:absolute;left:6px;top:6px;z-index:5;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;font-family:Menlo,monospace}
.thumb.on .tno{background:var(--ui)}

#panel{position:absolute;right:0;top:64px;bottom:0;width:300px;background:#fff;border-left:1px solid var(--ui-line);overflow:auto;padding:8px 22px 30px;z-index:40}
.grp{padding:18px 0;border-bottom:1px solid var(--ui-line)}
.grp label.h{display:block;font-size:13px;color:#999;margin-bottom:12px;letter-spacing:1px}
select{width:100%;height:44px;border:1px solid var(--ui-line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:#fff}
.seg{display:flex;background:#f2f0ec;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;font-size:14px;color:#777}
.seg button.on{background:#fff;color:#222;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw button{height:40px;border-radius:10px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.sw button.on{border-color:#222}
.sw .lab{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:#888}
.sw input[type=color]{width:100%;height:40px;border:1px solid var(--ui-line);border-radius:10px;background:#fff;padding:3px}
input[type=range]{width:100%;accent-color:var(--ui)}
.rv{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-top:4px}
.tip{font-size:13px;color:#999;line-height:1.7;margin-top:16px}

#view{position:absolute;left:220px;right:300px;top:64px;bottom:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(80,60,40,.18);background:var(--bg)}
#pager{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;padding:6px 10px;font-family:Menlo,monospace;font-weight:700;font-size:16px}
#pager button{border:0;background:none;width:34px;height:34px;border-radius:8px;color:#888;font-size:20px}
#pager button:hover{background:#f4f2ee}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);background:#222;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}

body.present #bar,body.present #side,body.present #panel,body.present #pager{display:none}
body.present #view{left:0;right:0;top:0;background:#000}
body.present #stage{border-radius:0;box-shadow:none}
html[data-mode=player] body{background:#000}
html[data-mode=player] #view{left:0;right:0;top:0;bottom:0;background:#000;cursor:pointer}
html[data-mode=player] #stage{border-radius:0;box-shadow:none}
#prog{position:absolute;left:0;bottom:0;height:6px;width:0;z-index:20;background:linear-gradient(90deg,var(--accent),#E3B5A4);transition:width .6s ease}

/* ================= SLIDES ================= */
.slide{position:absolute;inset:0;background:var(--bg);overflow:hidden;opacity:0;visibility:hidden;z-index:0}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.leaving{opacity:1;visibility:visible;z-index:1}
.slide>*:not(.deco){position:absolute;z-index:2}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco svg{width:100%;height:100%;display:block}

/* page transitions */
#stage[data-trans=none] .slide.leaving{visibility:hidden}
#stage[data-trans=fade] .slide.active{animation:tIn calc(.8s*var(--spd)) ease both}
#stage[data-trans=fade] .slide.leaving{animation:tOut calc(.8s*var(--spd)) ease both}
#stage[data-trans=slide] .slide.active{animation:sIn calc(.8s*var(--spd)) cubic-bezier(.7,0,.2,1) both}
#stage[data-trans=slide] .slide.leaving{animation:sOut calc(.8s*var(--spd)) cubic-bezier(.7,0,.2,1) both}
#stage[data-trans=zoom] .slide.active{animation:zIn calc(.8s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
#stage[data-trans=zoom] .slide.leaving{animation:zOut calc(.8s*var(--spd)) ease both}
#stage[data-trans=flip] .slide.active{animation:fIn calc(.9s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
#stage[data-trans=flip] .slide.leaving{animation:fOut calc(.5s*var(--spd)) ease-in both}
/* 3D cube */
#stage[data-trans=cube][data-dir=fwd] .slide.active{transform-origin:0% 50%;animation:cubeInF calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=fwd] .slide.leaving{transform-origin:100% 50%;animation:cubeOutF calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=back] .slide.active{transform-origin:100% 50%;animation:cubeInB calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
#stage[data-trans=cube][data-dir=back] .slide.leaving{transform-origin:0% 50%;animation:cubeOutB calc(1s*var(--spd)) cubic-bezier(.55,.05,.25,1) both}
@keyframes cubeInF{from{transform:perspective(2600px) translateX(100%) rotateY(90deg)}to{transform:perspective(2600px)}}
@keyframes cubeOutF{from{transform:perspective(2600px)}to{transform:perspective(2600px) translateX(-100%) rotateY(-90deg)}}
@keyframes cubeInB{from{transform:perspective(2600px) translateX(-100%) rotateY(-90deg)}to{transform:perspective(2600px)}}
@keyframes cubeOutB{from{transform:perspective(2600px)}to{transform:perspective(2600px) translateX(100%) rotateY(90deg)}}
#stage[data-trans=cube]{background:#2a2622}
/* 3D book */
.slide.leaving .a{opacity:1;animation:none}
.slide.leaving .bar{width:var(--w);transition:none}
.slide.leaving .rb{stroke-dashoffset:calc(100 - var(--p));transition:none}
.slide.leaving .draw{stroke-dashoffset:0;animation:none}
body[data-hl=underline] .slide.leaving mark{background-size:100% 100%;transition:none}
.slide.clipL{clip-path:inset(0 50% 0 0)}
.slide.clipR{clip-path:inset(0 0 0 50%)}
.slide.hold .a{animation:none!important;opacity:0!important}
.slide.hold .draw{animation:none!important}
.slide.hold .rb{stroke-dashoffset:100!important;transition:none!important}
.slide.hold .bar{width:0!important;transition:none!important}
.slide.flipped .in-tl,.slide.flipped .in-tr,.slide.flipped .in-bl,.slide.flipped .in-br,.slide.flipped .dots circle{animation:none!important}
.book{position:absolute;inset:0;z-index:6;perspective:3200px;pointer-events:none}
.book::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:80px;margin-left:-40px;background:linear-gradient(90deg,transparent,rgba(60,40,20,.18),transparent);z-index:7}
.flip{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face>.slide{width:1920px;right:auto}
.face.front>.slide{left:-960px}
.face.back>.slide{left:0}
.face .shade{position:absolute;inset:0;z-index:9;animation:pgShade var(--fd) ease-in-out both}
.face.front .shade{background:linear-gradient(90deg,rgba(40,25,10,.55),rgba(40,25,10,.1) 60%,rgba(255,255,255,.12))}
.face.back .shade{background:linear-gradient(270deg,rgba(40,25,10,.55),rgba(40,25,10,.1) 60%,rgba(255,255,255,.12))}
@keyframes pgFwd{0%{transform:rotateY(0)}50%{transform:rotateY(-90deg) translateZ(30px)}100%{transform:rotateY(-180deg)}}
@keyframes pgBack{0%{transform:rotateY(-180deg)}50%{transform:rotateY(-90deg) translateZ(30px)}100%{transform:rotateY(0)}}
@keyframes pgShade{0%,100%{opacity:0}50%{opacity:1}}
@keyframes tIn{from{opacity:0}to{opacity:1}}@keyframes tOut{from{opacity:1}to{opacity:0}}
@keyframes sIn{from{transform:translateX(calc(var(--dir,1)*100%))}to{transform:none}}
@keyframes sOut{from{transform:none}to{transform:translateX(calc(var(--dir,1)*-35%));opacity:.3}}
@keyframes zIn{from{opacity:0;transform:scale(1.18)}to{opacity:1;transform:none}}
@keyframes zOut{to{opacity:0;transform:scale(.88)}}
@keyframes fIn{from{opacity:0;transform:perspective(2400px) rotateY(calc(var(--dir,1)*-75deg))}to{opacity:1;transform:none}}
@keyframes fOut{to{opacity:0;transform:perspective(2400px) rotateY(calc(var(--dir,1)*75deg))}}

/* element entrance */
.a{opacity:0}
.slide.active .a{animation:var(--anim,up) calc(1s*var(--spd)) cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s)*var(--spd) + .25s*var(--spd))}
.a.l{--anim:fromL}.a.r{--anim:fromR}.a.z{--anim:pop}.a.b{--anim:blurIn}.a.dn{--anim:down}.a.sp{--anim:spread}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}
@keyframes blurIn{from{opacity:0;filter:blur(16px);transform:scale(1.06)}to{opacity:1;filter:none;transform:none}}
@keyframes spread{from{opacity:0;letter-spacing:0}to{opacity:1}}
body[data-anim=off] .a{animation:none!important;opacity:1}

/* deco motion */
.slide.active .in-tl{animation:dTL calc(1.6s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-tr{animation:dTR calc(1.6s*var(--spd)) cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-bl{animation:dBL calc(1.6s*var(--spd)) .1s cubic-bezier(.2,.8,.2,1) both}
.slide.active .in-br{animation:dBR calc(1.6s*var(--spd)) .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dTL{from{transform:translate(-300px,-240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dTR{from{transform:translate(300px,-240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dBL{from{transform:translate(-300px,240px);opacity:0}to{transform:none;opacity:1}}
@keyframes dBR{from{transform:translate(300px,240px);opacity:0}to{transform:none;opacity:1}}
.wc{opacity:var(--wc)}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(2deg)}}
.sway{transform-box:view-box;transform-origin:0 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .draw{animation:draw calc(2.4s*var(--spd)) calc(.5s*var(--spd)) ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dots circle{transform-box:fill-box;transform-origin:center}
.slide.active .dots circle{animation:dotIn .6s cubic-bezier(.2,.8,.2,1.4) both;animation-delay:calc(var(--i)*18ms + .6s)}
@keyframes dotIn{from{transform:scale(0)}to{transform:none}}
body[data-anim=off] .deco *{animation:none!important;stroke-dashoffset:0}
body[data-leaf=off] .leaf{display:none}

/* static (thumbnails / export / print) */
.static{opacity:1!important;visibility:visible!important;z-index:1!important}
.static *,.static{animation:none!important;transition:none!important}
.static .a{opacity:1!important}
.static .draw{stroke-dashoffset:0}

/* highlight styles */
mark{color:inherit;background:none;padding:0 .12em;transition:background-size calc(.9s*var(--spd)) calc(1.2s*var(--spd)) ease}
body[data-hl=glass] mark{background:var(--accent-soft);border:1.5px solid var(--accent-soft2);border-radius:10px;padding:0 .28em;box-shadow:inset 0 1px 0 #FDF1EE}
body[data-hl=capsule] mark{background:var(--accent);color:#fff;border-radius:999px;padding:.02em .5em}
body[data-hl=underline] mark{background-image:linear-gradient(transparent 60%,var(--accent-soft2) 60%);background-repeat:no-repeat;background-size:0% 100%}
body[data-hl=underline] .slide.active mark,body[data-hl=underline] .static mark{background-size:100% 100%}
body[data-hl=text] mark{color:var(--accent);font-weight:700}

/* slide components */
.cover-k{left:0;right:0;top:200px;text-align:center;font-size:24px;letter-spacing:10px;color:var(--sub)}
.cover-t1{left:0;right:0;top:250px;text-align:center;font-size:110px;font-weight:500;color:var(--accent);line-height:1.3;margin:0}
.cover-t2{left:0;right:0;top:395px;text-align:center;font-size:122px;font-weight:500;color:#1d1d1d;line-height:1.3;margin:0}
.cover-s{left:0;right:0;top:600px;text-align:center;font-size:20px;letter-spacing:20px;color:#6d6d6d}
.cover-r{left:0;right:0;top:745px;text-align:center;font-size:32px;color:#333}
.cover-d{left:0;right:0;top:805px;text-align:center;font-size:28px;color:var(--accent);letter-spacing:2px}

.hd{left:0;right:0;top:70px;display:flex;justify-content:center;align-items:center;gap:30px}
.hn{font-size:150px;font-weight:300;color:var(--accent);line-height:1}
.hd h2{margin:0;font-size:66px;font-weight:500;color:#3b3b3b;letter-spacing:4px}
.hd p{margin:6px 0 0;font-size:20px;color:var(--sub);letter-spacing:6px}

.pt{display:flex;gap:30px;margin-bottom:56px}
.pt i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:16px;box-shadow:0 0 0 9px var(--accent-soft)}
.pt h3{margin:0 0 10px;font-size:38px;font-weight:500;color:#333}
.pt p{margin:0;font-size:26px;line-height:1.85;color:#666}

.card{background:#FDF1EE;border-radius:26px;box-shadow:0 18px 50px rgba(200,120,105,.10);padding:46px;transition:transform .4s,box-shadow .4s}
.card:hover{transform:translateY(-8px);box-shadow:0 26px 60px rgba(200,120,105,.16)}
.ringbox{position:relative;width:250px;height:250px;margin:0 auto}
.ringbox svg{width:100%;height:100%}
.rb{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset calc(1.8s*var(--spd)) calc(.8s*var(--spd)) cubic-bezier(.3,.8,.2,1)}
.slide.active .rb,.static .rb{stroke-dashoffset:calc(100 - var(--p))}
.rnum{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:62px;font-weight:500;color:#444}
.ctext{font-size:27px;line-height:1.8;color:#555;text-align:center;margin:26px 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{display:inline-block;padding:9px 20px;border-radius:30px;background:#FBE9E4;color:#6b5a4a;font-size:21px}
.code{display:block;margin:24px auto 0;width:max-content;font-family:'SF Mono',Menlo,Consolas,monospace;background:#4F6B6B;color:#fff;padding:12px 28px;border-radius:12px;font-size:26px}

.legend{display:flex;gap:30px;font-size:22px;color:#777}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:26px;height:14px;border-radius:7px;display:inline-block}
.pr{display:flex;align-items:center;height:132px}
.pr .pl{width:240px;font-size:30px;color:#444}
.pr .pb{flex:1;display:flex;flex-direction:column;gap:14px;padding-right:150px}
.bar{height:30px;border-radius:0 15px 15px 0;width:0;position:relative;transition:width calc(1.3s*var(--spd)) cubic-bezier(.3,.8,.2,1);transition-delay:calc(var(--bd,.6s)*var(--spd))}
.slide.active .bar,.static .bar{width:var(--w)}
.bar.me{background:var(--accent)}.bar.old{background:#F3D6CF}
.bv{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:14px;font-size:24px;color:#555;white-space:nowrap}
.badge{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slide.active .badge.a{animation:pop calc(.9s*var(--spd)) both,wig 3s ease-in-out infinite;animation-delay:calc(var(--d)*var(--spd) + .25s),calc(var(--d)*var(--spd) + 1.5s)}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

.fm .tag{font-size:20px;letter-spacing:6px;color:var(--accent);font-weight:700}
.fm .big{font-size:120px;font-weight:700;color:#3b3b3b;line-height:1.1;margin:6px 0}
.fm p{margin:0;font-size:23px;color:#666;line-height:1.7}
.fm .price{margin-top:12px;font-size:26px;color:#444;font-weight:500}
.fm hr{border:0;border-top:2px dashed #F1D8D2;margin:24px 0}
.fm .stats{display:flex;gap:20px}
.fm .stats>div{flex:1}
.fm .stats b{display:block;font-size:52px;color:var(--accent);font-weight:700;line-height:1.2}
.fm .stats span{font-size:20px;color:#888}
.fm .note{margin-top:22px;font-size:21px}

.lead{left:0;right:0;top:270px;text-align:center;font-size:28px;color:#777}
.cs{top:350px;width:350px;height:590px;padding:38px 32px}
.cs .lb{font-size:16px;letter-spacing:5px;color:#aaa;font-weight:700}
.cs .big{font-size:76px;font-weight:700;color:var(--accent);line-height:1.15;margin:10px 0 4px;white-space:nowrap}
.cs .big small{font-size:30px;color:#888;font-weight:400;margin-left:6px}
.cs .vis{height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.cs .vis .mb{font-size:17px;color:#888}
.cs .vis .bar{height:16px;border-radius:0 8px 8px 0;margin-top:5px}
.cs .vis .bv{font-size:17px}
.cs h3{margin:16px 0 10px;font-size:30px;font-weight:500;color:#333}

<script>
(function(){
/* ---------------- deco generator ---------------- */
function R(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f=n=>n.toFixed(1);
function catmull(p,closed){
  const n=p.length;let d=`M${f(p[0][0])},${f(p[0][1])}`;
  const g=i=>closed?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}
  return d+(closed?'Z':'');
}
function blob(cx,cy,rx,ry,n,j,r){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(r()*2-1)*j;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return catmull(p,true)}
function wavy(x,y,w,h,n,r){const p=[];for(let i=0;i<n;i++)p.push([x+w*i/(n-1)+(r()-.5)*w/n,y+r()*h]);return catmull(p,false)}
const PAL={peach:['#F3D9C6','#E2AE8F'],sand:['#F4E6C8','#DFC08C'],blue:['#D6E7EA','#97BFC7'],rose:['#F3DAD3','#DDAE9F']};
function makeDeco(type,sid){
  const r=R(sid*97+11),m=sid%2===0,X=x=>m?1920-x:x,C='#DC9A8B',P='#EFBFBA',O='#E9A576',V='#CDA4A4',G='#4F6B6B';
  const blobs=[
    'M0,0 L640,0 C660,95 600,150 505,128 C420,108 392,52 330,72 C255,96 238,210 168,272 C115,318 55,342 0,350 Z',
    'M0,0 L600,0 C630,110 560,160 470,140 C380,120 370,60 300,90 C220,124 230,230 160,290 C110,332 50,350 0,360 Z',
    'M0,0 L680,0 C690,80 640,140 540,118 C450,98 420,40 350,64 C270,92 250,200 180,260 C125,306 60,330 0,338 Z'];
  const d=blobs[sid%3],big=type==='cover';
  const dots=(x,y,cols,rows,gap,rad,col)=>{let s='<g class="dots leaf">',i=0;for(let row=0;row<rows;row++)for(let c=0;c<cols;c++)s+=`<circle style="--i:${i++}" cx="${X(x+c*gap)}" cy="${y+row*gap}" r="${rad}" fill="${col}"/>`;return s+'</g>'};
  const bubbles=(x,y)=>`<g class="leaf"><g class="bub"><path d="M${X(x)},${y} h${m?-96:96} a12,12 0 0 1 ${m?-12:12},12 v52 a12,12 0 0 1 ${m?12:-12},12 h${m?62:-62} l${m?14:-14},20 v-20 h${m?20:-20} a12,12 0 0 1 ${m?12:-12},-12 v-52 a12,12 0 0 1 ${m?-12:12},-12z" fill="${V}"/></g>
    <g class="bub" style="animation-delay:-2.5s"><rect x="${X(x+30)-(m?118:0)}" y="${y+28}" width="118" height="70" rx="12" fill="${P}"/><path d="M${X(x+128)},${y+98} l${m?-22:22},26 v-26z" fill="${P}"/>
    <circle cx="${X(x+64)}" cy="${y+63}" r="7" fill="#fff"/><circle cx="${X(x+89)}" cy="${y+63}" r="7" fill="#fff"/><circle cx="${X(x+114)}" cy="${y+63}" r="7" fill="#fff"/></g></g>`;
  const clock=(cx,cy,rad)=>{cx=X(cx);let t='';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;t+=`<circle cx="${f(cx+Math.cos(a)*rad*.78)}" cy="${f(cy+Math.sin(a)*rad*.78)}" r="${i%3?2.4:3.6}" fill="#C99693"/>`}
    return `<g class="leaf"><circle cx="${cx}" cy="${cy}" r="${rad}" fill="#F4D3CF" stroke="#C99693" stroke-width="${rad*.13}"/>${t}
      <line class="hand slow" style="transform-origin:${cx}px ${cy}px" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-rad*.45}" stroke="#C99693" stroke-width="5" stroke-linecap="round"/>
      <line class="hand" style="transform-origin:${cx}px ${cy}px" x1="${cx}" y1="${cy}" x2="${cx+rad*.62}" y2="${cy}" stroke="#C99693" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="#C99693"/></g>`};
  const out=[];
  out.push(`<g ${m?'transform="translate(1920,0) scale(-1,1)"':''}><g class="in-tl"><g class="wc"><path class="blobm" d="${d}" fill="${C}" ${big?'transform="scale(1.35)"':''}/></g></g></g>`);
  out.push(`<g class="in-bl"><g class="wc"><path class="blobm" d="M${X(big?720:330)-(big?260:150)},1080 a${big?260:150},${big?260:150} 0 0 1 ${big?520:300},0z" fill="${C}"/></g></g>`);
  out.push(`<g class="in-tr">${bubbles(1640,58)}</g>`);
  out.push(dots(66,560,2,3,40,14,O));
  out.push(dots(1792,680,2,5,40,14,O));
  out.push(`<g class="in-br">${clock(1835,420,58)}</g>`);
  return `<svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${out.join('')}</svg>`;
}


/* ---------------- state ---------------- */
const PLAYER=document.documentElement.dataset.mode==='player';
const KEY='sheet-deck:'+location.pathname;
const DEF={flyers:[],trans:'fade',anim:'on',spd:1,hl:'glass',accent:'#DC9A8B',leaf:'on',wc:.9,auto:'on',src1:'',src2:'',src3:'',charts:[{id:'c1',sid:'s3',type:'area',src:'src3',x:0,ys:[2],title:'每次跑步距離（公里）',legend:'auto',labels:'on',smooth:'on',left:200,top:270,width:880,height:690},{id:'c2',sid:'s3',type:'bar',src:'src3',x:0,ys:[3],title:'每公里配速（越短越快）',legend:'auto',labels:'off',smooth:'on',left:1120,top:270,width:600,height:690}]};
let S=JSON.parse(JSON.stringify(DEF));
try{const baked=document.documentElement.dataset.settings;if(baked)Object.assign(S,JSON.parse(baked))}catch(e){}
if(!PLAYER)try{const st=JSON.parse(localStorage.getItem(KEY+':set')||'null');if(st)Object.assign(S,st)}catch(e){}
if(/^#B07A4E$/i.test(S.accent))S.accent='#DC9A8B';
let EDITS={};try{const be=document.documentElement.dataset.edits;if(be)EDITS=JSON.parse(be)}catch(e){}
if(!PLAYER)try{Object.assign(EDITS,JSON.parse(localStorage.getItem(KEY+':ed')||'{}'))}catch(e){}

const stage=document.getElementById('stage'),view=document.getElementById('view');
let slides=[...stage.querySelectorAll(':scope > .slide')];
slides.forEach((s,i)=>{if(!s.dataset.sid)s.dataset.sid='s'+(i+1)});
Object.keys(EDITS).forEach(k=>{const m=k.match(/^(\d+)-(\d+)$/);if(m){EDITS['s'+(+m[1]+1)+'-'+m[2]]=EDITS[k];delete EDITS[k]}});
(S.charts||[]).forEach(c=>{if(c.sid==null&&c.slide!=null)c.sid='s'+(c.slide+1);delete c.slide});
S.added=S.added||{};
const holder=document.getElementById('slideHold')||(()=>{const h=document.createElement('div');h.id='slideHold';h.style.display='none';document.body.appendChild(h);return h})();
const TPL={};slides.forEach(s=>{TPL[s.dataset.sid]=s.cloneNode(true)});
const BLANK='<section class="slide" data-deco="content"><div class="deco"></div><div class="hd"><div class="hn a z" data-ed>＋</div><div><h2 class="a l" style="--d:.1s" data-ed>新的頁面</h2><p class="a l" style="--d:.25s" data-ed>點這裡輸入副標題</p></div></div></section>';
function makeSlide(sid,from){let el;if(from==='blank'||!TPL[from]){const w=document.createElement('div');w.innerHTML=BLANK;el=w.firstElementChild}else el=TPL[from].cloneNode(true);
  el.dataset.sid=sid;el.classList.remove('active','leaving','hold','flipped','clipL','clipR');el.querySelectorAll('.chartbox').forEach(b=>b.remove());
  el.querySelectorAll('[data-id]').forEach(e=>e.removeAttribute('data-id'));const d=el.querySelector('.deco');if(d)d.innerHTML='';return el}
const allSlides=()=>[...stage.querySelectorAll(':scope > .slide'),...holder.querySelectorAll(':scope > .slide')];
const slideBySid=sid=>allSlides().find(s=>s.dataset.sid===sid);
Object.entries(S.added).forEach(([sid,a])=>{if(!slideBySid(sid))holder.appendChild(makeSlide(sid,a.from))});
const seedOf=sid=>/^s\d+$/.test(sid)?+sid.slice(1):[...sid].reduce((a,c)=>(a*31+c.charCodeAt(0))%997,7)+1;
function prepSlide(s){const d=s.querySelector('.deco');if(d&&!d.firstChild)d.innerHTML=makeDeco(s.dataset.deco,seedOf(s.dataset.sid));
  [...s.querySelectorAll('[data-ed]')].filter(el=>!el.closest('.tbox')).forEach((el,j)=>{el.dataset.id=s.dataset.sid+'-'+j;if(EDITS[el.dataset.id]!=null)el.innerHTML=EDITS[el.dataset.id];applyStyles(el)})}
function applyStyles(el){const id=el.dataset.id;if(S.fs&&S.fs[id])el.style.fontSize=S.fs[id]+'px';const t=(S.tst||{})[id];if(t){if(t.color)el.style.color=t.color;if(t.fw)el.style.fontWeight=t.fw;if(t.fst)el.style.fontStyle=t.fst;if(t.td)el.style.textDecoration=t.td}}

    const to=parseFloat(m[0].replace(/,/g,'')),dec=m[1]?m[1].length-1:0,comma=m[0].includes(','),pre=fin.slice(0,m.index),suf=fin.slice(m.index+m[0].length);
    const fmt=v=>{let t=v.toFixed(dec);if(comma)t=Number(t).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});return pre+t+suf};

    c.querySelectorAll('.num').forEach(e=>{if(e.dataset.fin)e.textContent=e.dataset.fin});return c};
  const front=fwd?mk(prev,true):mk(next,false),back=fwd?mk(next,false):mk(prev,true);

  book.innerHTML='<div class="flip"><div class="face front"><div class="shade"></div></div><div class="face back"><div class="shade"></div></div></div>';

  t.focus();const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);thumbsLater();
  toast('已新增文字框：直接打字取代內容；拖曳左側 ⠿ 移動，拉右側圓點調整寬度')}
function delTb(id){S.texts=(S.texts||[]).filter(t=>t.id!==id);const k='tb-'+id;delete EDITS[k];if(S.fs)delete S.fs[k];if(S.tst)delete S.tst[k];
  const b=allTb().find(x=>x.dataset.tid===id);if(b)b.remove();saveS();saveEdits();if(window.__textUI)window.__textUI.el=null;thumbsLater();toast('已刪除文字框')}
function copyTextsTo(fromSid,toSid){(S.texts||[]).filter(t=>t.sid===fromSid).forEach((t,k)=>{const id='t'+Date.now().toString(36)+k,o='tb-'+t.id,n='tb-'+id;
  S.texts.push({...t,id,sid:toSid});if(EDITS[o]!=null)EDITS[n]=EDITS[o];if(S.fs&&S.fs[o])S.fs[n]=S.fs[o];if(S.tst&&S.tst[o])S.tst[n]={...S.tst[o]}})}
if(!PLAYER){document.getElementById('bText').onclick=addText;
  stage.addEventListener('focusin',e=>{const b=e.target.closest('.tbox');allTb().forEach(x=>x.classList.toggle('sel',x===b))});
  stage.addEventListener('pointerdown',e=>{if(!e.target.closest('.tbox'))allTb().forEach(x=>x.classList.remove('sel'))});}

/* ---------------- text size ---------------- */
if(!PLAYER){
  const tg=document.getElementById('textGrp'),tSize=document.getElementById('tSize'),tRange=document.getElementById('tRange'),tScope=document.getElementById('tScope');
  let edEl=null,savedRange=null;
  const inEd=n=>n&&edEl&&edEl.contains(n.nodeType===1?n:n.parentNode);
  const selRange=()=>{const s=getSelection();if(s.rangeCount&&!s.isCollapsed){const r=s.getRangeAt(0);if(inEd(r.startContainer)&&inEd(r.endContainer))return r}return null};
  const sizeOf=n=>Math.round(parseFloat(getComputedStyle(n.nodeType===1?n:n.parentNode).fontSize));
  let showText=function(){if(!edEl){tg.style.display='none';return}const r=selRange()||savedRange;
    const v=r&&!r.collapsed?sizeOf(r.startContainer):sizeOf(edEl);tSize.value=v;tRange.value=Math.min(200,v);
    tScope.innerHTML=r&&!r.collapsed?'套用到：<b>選取的文字</b>':'套用到：<b>整段文字</b>（先反白部分文字，就只改那幾個字）';tg.style.display='block'};
  function saveEd(){EDITS[edEl.dataset.id]=edEl.innerHTML;saveEdits();thumbsLater()}
  function setSize(v){if(!edEl)return;v=Math.max(8,Math.min(300,Math.round(v)));
    const s=getSelection();let r=selRange();if(!r&&savedRange&&!savedRange.collapsed){s.removeAllRanges();s.addRange(savedRange);r=savedRange}
    const sc=r&&r.startContainer;if(r&&sc===r.endContainer&&sc.nodeType===1&&sc.tagName==='SPAN'&&sc!==edEl&&r.startOffset===0&&r.endOffset===sc.childNodes.length){sc.style.fontSize=v+'px';saveEd();showText();return}
    if(r){const sp=document.createElement('span');sp.style.fontSize=v+'px';sp.appendChild(r.extractContents());
      sp.querySelectorAll('span').forEach(x=>{x.style.fontSize='';if(!x.getAttribute('style'))x.replaceWith(...x.childNodes)});
      r.insertNode(sp);const nr=document.createRange();nr.selectNodeContents(sp);s.removeAllRanges();s.addRange(nr);savedRange=nr.cloneRange();saveEd()}
    else{(S.fs=S.fs||{})[edEl.dataset.id]=v;edEl.style.fontSize=v+'px';saveS();thumbsLater()}
    showText()}
  const step=v=>v<30?1:v<60?2:4;
  const bump=d=>{if(!edEl){toast('先點一下投影片上的文字');return}const v=+tSize.value||sizeOf(edEl);setSize(v+d*step(v))};
  stage.addEventListener('focusin',e=>{const el=e.target.closest('[data-ed]');if(el){edEl=el;savedRange=null;if(typeof selectChart==='function'&&selId)selectChart(null);showText()}});
  document.addEventListener('selectionchange',()=>{const r=selRange();if(r){savedRange=r.cloneRange();showText()}});
  stage.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-ed]')&&!e.target.closest('.chartbox')){edEl=null;savedRange=null;showText()}});
  tg.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
  document.getElementById('tMinus').onclick=()=>bump(-1);
  document.getElementById('tPlus').onclick=()=>bump(1);
  tSize.onchange=()=>setSize(+tSize.value);
  tRange.oninput=()=>setSize(+tRange.value);
  tg.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>setSize(+b.dataset.sz));
  document.getElementById('tReset').onclick=()=>{if(!edEl)return;const id=edEl.dataset.id;if(S.fs)delete S.fs[id];if(S.tst)delete S.tst[id];['fontSize','color','fontWeight','fontStyle','textDecoration'].forEach(p=>edEl.style[p]='');
    edEl.querySelectorAll('[style]').forEach(x=>x.removeAttribute('style'));edEl.querySelectorAll('span,b,i,u,strong,em,font').forEach(x=>x.replaceWith(...x.childNodes));
    saveS();saveEd();savedRange=null;showText();toast('已恢復預設樣式')};
  /* --- color / bold / italic / underline --- */
  const tB=document.getElementById('tB'),tI=document.getElementById('tI'),tU=document.getElementById('tU'),tColor=document.getElementById('tColor'),tDelBox=document.getElementById('tDelBox');
  const toHex=c=>{const m=String(c).match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#000000'};
  function restoreSel(){const s=getSelection();let r=selRange();if(!r&&savedRange&&!savedRange.collapsed){edEl.focus({preventScroll:true});s.removeAllRanges();s.addRange(savedRange);r=savedRange}return r}
  function styleState(){if(!edEl)return;const r=selRange()||(savedRange&&!savedRange.collapsed?savedRange:null),n=r?(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentNode):edEl,cs=getComputedStyle(n);
    tB.classList.toggle('on',+cs.fontWeight>=600);tI.classList.toggle('on',cs.fontStyle==='italic');
    let u=false;for(let x=n;x&&x!==edEl.parentNode;x=x.parentNode){if(x.nodeType===1&&/underline/.test(getComputedStyle(x).textDecorationLine)){u=true;break}}tU.classList.toggle('on',u);
    tColor.value=toHex(cs.color);document.querySelectorAll('#textGrp .tcol button').forEach(b=>b.classList.toggle('on',b.dataset.c.toLowerCase()===tColor.value.toLowerCase()));
    tDelBox.style.display=edEl.closest('.tbox')?'flex':'none'}
  const _show=showText;showText=function(){_show();styleState()};
  function setStyle(kind,val){if(!edEl){toast('先點一下投影片上的文字');return}const r=restoreSel();
    if(r){edEl.focus({preventScroll:true});const s=getSelection();if(!s.rangeCount||s.isCollapsed){s.removeAllRanges();s.addRange(r)}
      document.execCommand('styleWithCSS',false,true);document.execCommand({bold:'bold',italic:'italic',underline:'underline',color:'foreColor'}[kind],false,val||null);
      const nr=getSelection().rangeCount?getSelection().getRangeAt(0):null;if(nr&&!nr.collapsed)savedRange=nr.cloneRange();saveEd()}
    else{const id=edEl.dataset.id,t=(S.tst=S.tst||{})[id]=(S.tst[id]||{}),cs=getComputedStyle(edEl);
      if(kind==='bold')t.fw=+cs.fontWeight>=600?'400':'700';
      if(kind==='italic')t.fst=cs.fontStyle==='italic'?'normal':'italic';
      if(kind==='underline')t.td=/underline/.test(cs.textDecorationLine)?'none':'underline';
      if(kind==='color')t.color=val;applyStyles(edEl);saveS();thumbsLater()}
    showText()}
  tB.onclick=()=>setStyle('bold');tI.onclick=()=>setStyle('italic');tU.onclick=()=>setStyle('underline');
  document.querySelectorAll('#textGrp .tcol button').forEach(b=>b.onclick=()=>setStyle('color',b.dataset.c));
  tColor.addEventListener('input',()=>setStyle('color',tColor.value));
  tDelBox.onclick=()=>{const b=edEl&&edEl.closest('.tbox');if(b)delTb(b.dataset.tid)};
  addEventListener('keydown',e=>{if(!edEl||!(e.metaKey||e.ctrlKey)||e.shiftKey||e.altKey)return;const a=document.activeElement;if(!a||!a.isContentEditable)return;
    const k=e.key.toLowerCase();if(k==='b'||k==='i'||k==='u'){e.preventDefault();savedRange=selRange()?selRange().cloneRange():null;setStyle({b:'bold',i:'italic',u:'underline'}[k])}},true);
  window.__textUI={get el(){return edEl},set el(v){edEl=v;savedRange=null;showText()}};

  addEventListener('keydown',e=>{if(!edEl||!(e.metaKey||e.ctrlKey)||!e.shiftKey)return;const a=document.activeElement;if(!a||!a.isContentEditable)return;
    if(e.code==='Period'){e.preventDefault();bump(1)}else if(e.code==='Comma'){e.preventDefault();bump(-1)}},true);
}

/* ---------------- init ---------------- */
renderTexts();renderUnity();setEditable(!PLAYER);renderAllCharts();apply();fit();buildThumbs();refreshData(true);schedule();
syncOrder();buildThumbs();slides[0].classList.add('active');cur=0;go(0,1,true);
})();
</script>
